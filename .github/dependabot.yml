version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Bogota'
    open-pull-requests-limit: 10
    reviewers:
      - 'sg-sst-team'
    assignees:
      - 'sg-sst-team'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      development-dependencies:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier*'
          - 'typescript*'
          - 'vitest*'
          - 'playwright*'
          - '@testing-library/*'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        patterns:
          - 'react*'
          - 'fastify*'
          - 'zod*'
          - 'pdfkit*'
          - 'exceljs*'
          - 'nodemailer*'
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Bogota'
    open-pull-requests-limit: 5
    reviewers:
      - 'sg-sst-team'
    assignees:
      - 'sg-sst-team'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
